    <!-- Данные раздела БЦ — старт загрузки ДО бандла (Ш3-b плана
         docs/bc-catalog-seo-plan.md). React здесь не гидратирует, а сносит
         пререндер-снапшот и строит DOM заново (см. main.tsx): без данных
         первый клиентский рендер показывал «Загрузка…» вместо готовой
         страницы — отсюда CLS 0,221 и пустой экран на секунды. Файлы
         кладёт scripts/generate-catalog-data.mjs, отдаёт тот же CDN, что и
         саму страницу, поэтому ответ приходит раньше бандла, и монтирование
         его уже не ждёт. Инлайном, а не из бандла: запрос должен уйти в
         первые миллисекунды, а бандл подключается отложенно. -->
    <script>
      (function () {
        var path = location.pathname;
        // Два каталога на одном шаблоне: бизнес-центры (/minsk/bc) и
        // торговые центры (/minsk/tc, 2026-09-23). Файлы зданий у них общие
        // (/data/bc/<slug>.json), различаются список и корень пути.
        var base = path === '/minsk/tc' || path.indexOf('/minsk/tc/') === 0 ? '/minsk/tc' : '/minsk/bc';
        // /bc/<slug> — та же карточка здания для сайта самого БЦ (владелец,
        // 2026-09-24): без шапки, соседей и объявлений. Vercel отдаёт на
        // этот адрес пререндер /minsk/bc/<slug> — с каноническим адресом
        // карточки, но и со всем, что в режиме владельца скрыто. Класс
        // прячет эту разметку до монтирования React, чтобы посетитель с
        // сайта БЦ не увидел на миг чужие здания. Снимает класс сама
        // страница; на случай сбоя бандла — анимация в <style> ниже через
        // 4 с (React монтируется не позже 3,5 с, см. main.tsx).
        var ownerPage = path.indexOf('/bc/') === 0;
        if (ownerPage) document.documentElement.classList.add('bc-owner-pending');
        if (!ownerPage && path !== base && path.indexOf(base + '/') !== 0) return;
        window.__bcKind = base === '/minsk/tc' ? 'tc' : 'bc';
        // priority: 'low' — на медленном 4G эти JSON делили канал с
        // LCP-фото карточки и отодвигали его на секунду (замер 2026-09-23:
        // список 109 КБ стартовал первым, фото доезжало к 2,46 с). Данные
        // нужны только к монтированию React, а оно и так ждёт отрисовку
        // фото — уступить канал ничего не стоит.
        //
        // И сами запросы стартуют только после загрузки главного фото
        // (img[fetchpriority="high"] снапшота) или, если фото нет, после
        // разбора документа. Симуляция PageSpeed считает LCP с учётом всех
        // запросов, начатых до его отрисовки: 234 КБ данных, ушедшие из
        // <head>, на медленном 4G дописывали к LCP каталога почти секунду
        // (87 вместо 94, 2026-09-23), хотя в браузере фото рисовалось вовремя.
        // React монтируется только после отрисовки фото (main.tsx) и ждёт
        // данные сам, так что позднее начало ему ничего не стоит.
        var heroReady = new Promise(function (resolve) {
          // Не «фото загружено», а «фото засчитано как LCP»: ждём саму
          // запись largest-contentful-paint о нём. Два кадра после загрузки
          // не гарантируют этого (замер: запрос уходил за 8 мс до записи).
          // Запасной путь — через 300 мс после двух кадров: Safari LCP не
          // сообщает, а если фото мельче заголовка, записи о нём не будет.
          var watchLcp = function (img) {
            try {
              var po = new PerformanceObserver(function (list) {
                var entries = list.getEntries();
                for (var i = 0; i < entries.length; i++) {
                  if (entries[i].element === img) { po.disconnect(); resolve(); return; }
                }
              });
              po.observe({ type: 'largest-contentful-paint', buffered: true });
            } catch (e) { /* нет LCP в браузере — сработает запасной путь */ }
          };
          var painted = function () {
            requestAnimationFrame(function () {
              requestAnimationFrame(function () { setTimeout(resolve, 300); });
            });
          };
          var check = function () {
            var img = document.querySelector('#root img[fetchpriority="high"]');
            if (!img) return resolve();
            watchLcp(img);
            if (img.complete) return painted();
            img.addEventListener('load', painted, { once: true });
            img.addEventListener('error', function () { resolve(); }, { once: true });
          };
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', check, { once: true });
          else check();
          // Страховка: битое или зависшее фото не держит данные дольше 3 с.
          setTimeout(resolve, 3000);
        });
        var get = function (url) {
          return heroReady
            .then(function () { return fetch(url, { priority: 'low' }); })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        };
        window.__bcList = get(base === '/minsk/tc' ? '/data/trade-centers.json' : '/data/business-centers.json');
        // Ставки рынка и размеры лотов: без них первый кадр React рисует
        // карточки и блоки иначе, чем пререндер-снапшот, и вёрстка прыгает.
        window.__bcMarket = get('/data/bc-market.json');
        var rest = path.slice(ownerPage ? '/bc'.length : base.length).replace(/^\/+|\/+$/g, '');
        // Карточка здания — ровно один сегмент пути. Разделы каталога с
        // такой же формой перечислены явно, чтобы не ходить за файлом,
        // которого заведомо нет (лишний 404 в консоли и в аудите).
        // ФАЙЛ-БЛИЗНЕЦ: это односегментные маршруты /minsk/bc/<x> из
        // src/App.tsx; сверяет тест в src/lib/businessCentersApi.test.ts.
        var sections = ['rating', 'guide', 'analytics', 'new'];
        if (rest && rest.indexOf('/') === -1 && (ownerPage || sections.indexOf(rest) === -1)) {
          window.__bcDetail = { slug: rest, data: get('/data/bc/' + encodeURIComponent(rest) + '.json') };
          // Объявления, отзывы, окружение, 2ГИС, арендаторы — снапшот
          // карточки нарисован с ними, и без них к монтированию блоки на
          // десктопе пропадали и появлялись снова (CLS 0,33, 2026-09-23).
          window.__bcExtra = { slug: rest, data: get('/data/bc/' + encodeURIComponent(rest) + '.extra.json') };
        }
      })();
    </script>
    <style>
      html.bc-owner-pending #root { visibility: hidden; animation: bc-owner-reveal 0s 4s forwards; }
      @keyframes bc-owner-reveal { to { visibility: visible; } }
    </style>

    <!-- Признак «это не человек» — общий для Метрики, VK-пикселя ниже и для
         счётчика «N онлайн» в админке (src/lib/botDetection.ts читает
         window.__isLikelyBot). Проверка стоит здесь, а не только в бандле,
         потому что счётчики инициализируются раньше, чем грузится бандл:
         иначе визит ИИ-агента/скрейпера, выполняющего JS, успевал уйти в
         Метрику до любой проверки на уровне React. Headless-браузеры
         (Playwright/Puppeteer/Selenium — на них работает большинство
         агентов) выставляют navigator.webdriver, обычный браузер человека —
         никогда; плюс список UA известных ботов и AI-краулеров.
         ФАЙЛ-БЛИЗНЕЦ: регулярка продублирована в src/lib/botDetection.ts,
         правится всегда в обоих местах (см. CLAUDE.md). -->
    <script type="text/javascript">
      window.__isLikelyBot = (function () {
        try {
          if (navigator.webdriver) { return true; }
          return /bot|spider|crawl|slurp|headless|puppeteer|playwright|selenium|phantomjs|gptbot|chatgpt-user|oai-searchbot|claudebot|anthropic-ai|ccbot|perplexitybot|bytespider|petalbot|mj12bot|dotbot|ahrefsbot|semrushbot|facebookexternalhit|telegrambot|discordbot|whatsapp/i.test(navigator.userAgent);
        } catch (e) { return false; }
      })();
    </script>

    <!-- Yandex.Metrika counter — ?prerender=1 в URL ставит только
         scripts/prerender.mjs при снятии build-time снапшота (SEO_PLAN.md,
         Э2-1): без этой проверки каждый деплой/пересборка слал бы в
         Метрику фантомные визиты с build-сервера. Реальные посетители на
         этот параметр никогда не попадают — открывают чистый /<slug>.

         PAGESPEED_PLAN.md, Э3 — сам tag.js (87 КиБ, ~800 мс CPU в отчёте
         PageSpeed) вставляется в DOM не сразу, а после полной загрузки
         страницы + паузы: очередь m[i].a копит вызовы ym(...) ниже
         независимо от того, успел ли уже прогрузиться сам скрипт — штатный
         механизм Метрики, инициализация (url/referrer/accurateTrackBounce)
         остаётся синхронной. Компромисс: визиты короче ~2 с (ушли раньше,
         чем скрипт успел встать в DOM) не досчитываются — владелец
         предупреждён, при текущем трафике это единицы в месяц. Вебвизор
         (запись сессий) выключен — владелец подтвердил, что не пользуется.

         2026-09-10 — /admin/* (внутренняя CRM) исключён из условия совсем:
         счётчик там даже не инициализируется (window.ym остаётся
         undefined), а не просто «не шлёт хиты» — прямой заход на
         /admin/... (закладка сотрудника, полная перезагрузка страницы, не
         SPA-переход) иначе засчитывался бы как визит в саму Метрику ДО
         того, как успевает сработать проверка на уровне React
         (useSpaPageviewHits в App.tsx — та защищает только последующую
         SPA-навигацию, не первый заход). metrikaHit()/vkPixelHit() и так
         оптионал-чейнят вызов ym()/_tmr, ничего дополнительно чинить в них
         не нужно. -->
    <script type="text/javascript">
      // 2026-09-25 (владелец, баннер cookie) — тело больше не выполняется
      // сразу: вставлено в window.__startMetrika, которую снизу (после
      // VK-пикселя) зовёт window.__startAnalytics, только если а) все
      // прежние условия (бот/prerender/admin) выполнены и б) в localStorage
      // уже лежит cookie-consent === 'all'. Без записи в localStorage
      // (первый визит, баннер ещё не нажат) счётчик просто не стартует —
      // ФАЙЛ-БЛИЗНЕЦ с src/lib/cookieConsent.ts, правится в обоих местах.
      window.__startMetrika = function () {
        if (window.__metrikaStarted) { return; }
        if (window.__isLikelyBot || location.search.indexOf('prerender=1') !== -1 || location.pathname.indexOf('/admin') === 0) { return; }
        window.__metrikaStarted = true;
        (function (m, e, t, r, i, k, a) {
          m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments) };
          m[i].l = 1 * new Date();
          function insertTag() {
            for (var j = 0; j < document.scripts.length; j++) { if (document.scripts[j].src === r) { return; } }
            k = e.createElement(t), a = e.getElementsByTagName(t)[0], k.async = 1, k.src = r, a.parentNode.insertBefore(k, a);
          }
          if (document.readyState === 'complete') { setTimeout(insertTag, 2000); }
          else { window.addEventListener('load', function () { setTimeout(insertTag, 2000); }); }
        })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js?id=111858495', 'ym');

        ym(111858495, 'init', { ssr: true, webvisor: false, clickmap: true, ecommerce: 'dataLayer', referrer: document.referrer, url: location.href, accurateTrackBounce: true, trackLinks: true });
      };
    </script>
    <!-- /Yandex.Metrika counter -->

    <!-- Top.Mail.Ru (VK Реклама / VK Ретаргетинг) pixel — тот же принцип
         отложенной вставки, что и у Метрики выше: window._tmr — просто
         массив-очередь (не сетевой вызов), pageView кладётся в него сразу
         (нужна точная метка времени), а сам code.js (сетевая нагрузка)
         вставляется в DOM только после полной загрузки страницы + паузы —
         не в критическом пути первой отрисовки. ?prerender=1 (build-time
         снапшот, см. Метрику выше) не должен слать фантомные события.
         /admin/* исключён тем же принципом, что и у Метрики выше — сотрудники
         CRM не должны пополнять ретаргетинговую аудиторию VK-рекламы. -->
    <script type="text/javascript">
      // 2026-09-25 (владелец, баннер cookie) — тот же принцип, что у
      // Метрики выше: тело в window.__startTmr, стартует только по явному
      // вызову из __startAnalytics ниже (согласие 'all' уже в localStorage
      // или только что нажата кнопка "Принять все").
      window.__startTmr = function () {
        if (window.__tmrStarted) { return; }
        if (window.__isLikelyBot || location.search.indexOf('prerender=1') !== -1 || location.pathname.indexOf('/admin') === 0) { return; }
        window.__tmrStarted = true;
        var _tmr = window._tmr || (window._tmr = []);
        _tmr.push({ id: '3793248', type: 'pageView', start: (new Date()).getTime() });
        (function (d, w) {
          function insertTag() {
            if (d.getElementById('tmr-code')) { return; }
            var ts = d.createElement('script');
            ts.type = 'text/javascript';
            ts.async = true;
            ts.id = 'tmr-code';
            ts.src = 'https://top-fwz1.mail.ru/js/code.js';
            var s = d.getElementsByTagName('script')[0];
            s.parentNode.insertBefore(ts, s);
          }
          if (d.readyState === 'complete') { setTimeout(insertTag, 2000); }
          else { w.addEventListener('load', function () { setTimeout(insertTag, 2000); }); }
        })(document, window);
      };
    </script>
    <!-- /Top.Mail.Ru (VK) pixel -->

    <!-- Общий запуск аналитики по согласию cookie (владелец, 2026-09-25).
         window.__startAnalytics зовут: 1) сразу здесь, если в localStorage
         уже лежит cookie-consent === 'all' (повторный визит после "Принять
         все"); 2) src/components/layout/CookieBanner.tsx по клику "Принять
         все" (см. src/lib/cookieConsent.ts — тот же ключ, файл-близнец).
         localStorage читаем в try/catch — приватный режим/заблокированный
         storage не должны ронять страницу. -->
    <script type="text/javascript">
      window.__startAnalytics = function () {
        if (window.__startMetrika) { window.__startMetrika(); }
        if (window.__startTmr) { window.__startTmr(); }
      };
      (function () {
        try {
          if (window.localStorage.getItem('cookie-consent') === 'all') { window.__startAnalytics(); }
        } catch (e) { /* приватный режим — просто не стартуем, баннер спросит снова */ }
      })();
    </script>
