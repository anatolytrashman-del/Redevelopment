<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,sans-serif;background:#ecebe8;color:#16171a;padding:24px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:18px}
.card{background:#f7f6f4;border-radius:26px;padding:24px 26px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.top h2{font-size:18px;font-weight:800}
.top span{font-size:12px;color:#6b6d73}
.row{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.list{background:#fff;border:1px solid #e7e5e1;border-radius:18px;padding:12px 16px}
.it{display:flex;gap:12px;align-items:center;padding:9px 0;font-size:14px}
.it + .it{border-top:1px solid #efedea}
.ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.ic svg{width:18px;height:18px}
.it small{display:block;color:#6b6d73;font-size:12px}
.side{display:grid;gap:10px}
.tile{background:#fff;border:1px solid #e7e5e1;border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.v{font-size:22px;font-weight:800}
.k{font-size:12px;color:#6b6d73}
.cta{border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;color:#fff;background:#e4152b;display:inline-block}
.h svg{width:22px;height:22px}
.h{display:flex;gap:8px;align-items:center;font-size:17px;font-weight:700;margin-bottom:10px}
</style></head><body>
<div class="wrap" id="root"></div>
<script>
const I={
 lift:'<path d="M8 3v18M16 3v18M4 8l4-5 4 5M12 16l4 5 4-5"/>',
 wifi:'<path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M2 9a15 15 0 0 1 20 0"/><circle cx="12" cy="19.5" r="1"/>',
 baby:'<circle cx="12" cy="7" r="3"/><path d="M6 21v-3a6 6 0 0 1 12 0v3"/>',
 card:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>',
 car:'<path d="M5 17h14l-1.5-6h-11z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'};
const svg=(k,c)=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const V=[
 ['Сейчас','красные иконки на розовом','#e4152b','#fdecee','#e4152b'],
 ['А. Графит','тёмно-серые на светло-сером, красный только в кнопках','#3b3d44','#eceae6','#3b3d44'],
 ['Б. Спокойный синий','сине-серые на голубоватом','#3f5f86','#e8eef5','#3f5f86'],
 ['В. Тёплый песок','коричнево-песочные на бежевом','#8a6a3b','#f3ece0','#8a6a3b'],
];
document.getElementById('root').innerHTML=V.map(([n,d,c,bg,h])=>`
<div class="card"><div class="top"><h2>${n}</h2><span>${d}</span></div>
<div class="row">
 <div class="list"><div class="h">${svg('chart',h)} Инфраструктура</div>
  ${[['lift','Эскалаторы и лифты','на всех этажах'],['wifi','Бесплатный Wi-Fi','во всей галерее'],['baby','Комната матери и ребёнка','5 этаж'],['card','Банкоматы','1 и −1 этаж']].map(([k,t,s])=>`<div class="it"><div class="ic" style="background:${bg}">${svg(k,c)}</div><div>${t}<small>${s}</small></div></div>`).join('')}
 </div>
 <div class="side">
  <div class="tile"><div class="ic" style="background:${bg}">${svg('car',c)}</div><div><div class="v">685</div><div class="k">мест на парковке</div></div></div>
  <div class="tile"><div class="ic" style="background:${bg}">${svg('chart',c)}</div><div><div class="v">12 млн+</div><div class="k">посещений в год</div></div></div>
  <div><span class="cta">+375 (44) 597-18-88</span></div>
 </div>
</div></div>`).join('');
</script>
</body></html>
