# Ручной запуск синка Яндекс.Вебмастера. САМО РАСПИСАНИЕ ЗДЕСЬ БОЛЬШЕ НЕ
# ЖИВЁТ — с 2026-09-16 синк выполняет Edge Function
# supabase/functions/sync-yandex-webmaster по pg_cron (раз в сутки, 05:47 UTC).
# Причина переезда и почему здесь нет логики — см. соседний
# sync-yandex-metrika.yml и шапку самой функции.
name: Sync Yandex Webmaster stats

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Вызвать Edge Function
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://iohcdylttyuhwovztrbk.supabase.co/functions/v1/sync-yandex-webmaster" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          code=$(echo "$response" | tail -n1)
          echo "$response" | sed '$d'
          test "$code" = "200"
