# Ручная отправка списка URL в IndexNow (Яндекс, Bing). Автоматическая
# отправка живёт в сборке (scripts/notify-indexnow.mjs); этот воркфлоу — для
# разовых случаев вроде переезда адресов (data/indexnow/*.txt). Отдельно от
# сборки, потому что из песочницы Claude api.indexnow.org закрыт.
name: IndexNow submit

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Файл со списком URL (по одному на строку)'
        type: string
        default: 'data/indexnow/bc-catalog-move-2026-09-23.txt'

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Отправить в IndexNow
        env:
          URL_FILE: ${{ inputs.file }}
        run: node scripts/indexnow-submit.mjs "$URL_FILE"
