name: CI

# P1.2 аудита безопасности — раньше сломанный тайпчек/тесты можно было
# замержить и узнать об этом только от Vercel после деплоя. Запускается и
# на pull request (как просил документ), и на пуш в прод-ветку (реальный
# рабочий процесс в этом репозитории — фичи пушатся туда напрямую, без PR,
# см. CLAUDE.md "Workflow при внесении изменений") — иначе проверка почти
# никогда бы не срабатывала на практике.
on:
  pull_request:
  push:
    branches:
      - claude/redevelopment-platform-prototype-oodobu

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      # Именно build:app, а не build. Полный `npm run build` доходит до
      # scripts/prerender.mjs, а тот вне Vercel всегда идёт в ПОЛНЫЙ режим и
      # запускает браузер по абсолютному пути /opt/pw-browsers/chromium
      # (окружение сессий Claude Code, см. CLAUDE.md). На раннере GitHub
      # такого файла нет, поэтому шаг падал на «38 критичных путей остались
      # без снапшота» — и CI был красным на КАЖДОМ пуше в прод-ветку, то есть
      # проверка, ради которой он заводился, ничего уже не значила.
      # Пререндер и OG-обложки всё равно имеют смысл только на прод-сборке
      # Vercel (живые данные, копия с прода) — там `npm run build` как был.
      - run: npm run build:app
      - run: npm run audit:rls
