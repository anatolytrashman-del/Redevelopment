name: malllist release gate

# Ручной прогон перед выпуском malllist. Не cron и не push: квота
# GitHub Free не рассчитана на почасовой или «на каждый пуш» Lighthouse.
# Файл только описывает проверку. Он не деплоит прод и не включается,
# пока ветка не влита туда, где её запускают руками.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL уже собранного кандидата (не запускает сборку Vercel)'
        required: true
        type: string

concurrency:
  group: malllist-release-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lighthouse gate
        run: node scripts/malllist-release-gate.mjs --url "${{ inputs.url }}" --runs 3 --out artifacts/malllist-release-gate
