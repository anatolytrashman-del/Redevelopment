name: Sync citywide office offers (Kufar + Realt + Domovita + Megapolis)

on:
  schedule:
    # Раз в месяц, 3-го числа — до build-market-snapshots.yml (0 6 3 * *),
    # как у соседних городских сегментов. Сдвинут на полчаса от торговых и
    # складов (оба 0 5 3 * *), чтобы три сегмента не тянули Kufar и Realt
    # одновременно: у офисов самая большая выдача из всех.
    #
    # Заведён 2026-09-20. До этого у сегмента 'ofisy' воркфлоу не было
    # ВОВСЕ — в отличие от торговых, складов и машиномест: скрипт
    # существовал с 2026-09-08, но запускался только руками, и в таблице
    # лежал снимок того дня, когда кто-то его последний раз запустил.
    # Периодические задачи по правилу CLAUDE.md заводятся в pg_cron, а не в
    # Actions, но то правило про частые кроны (GitHub затроттлил аккаунт за
    # три крона раз в 5 минут); здесь — раз в месяц и рядом с тремя такими
    # же соседями, а переносить сбор в Edge Function значило бы переписать
    # скрапер целиком.
    - cron: '30 5 3 * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/sync-citywide-office-offers.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
