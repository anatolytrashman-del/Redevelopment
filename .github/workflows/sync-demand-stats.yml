name: Sync demand stats (Kufar + Realt + Avito + Megapolis-real)

on:
  schedule:
    # Каждый час
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/sync-kufar-stats.mjs
        env:
          KUFAR_BEARER_TOKEN: ${{ secrets.KUFAR_BEARER_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # if: always() — чтобы сбой одного источника не мешал остальным
      - run: node scripts/sync-realt-stats.mjs
        if: always()
        env:
          REALT_COOKIE: ${{ secrets.REALT_COOKIE }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: node scripts/sync-avito-stats.mjs
        if: always()
        env:
          AVITO_COOKIE: ${{ secrets.AVITO_COOKIE }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: node scripts/sync-megapolis-stats.mjs
        if: always()
        env:
          MEGAPOLIS_COOKIE: ${{ secrets.MEGAPOLIS_COOKIE }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
