name: Sync Yandex Metrika stats

on:
  schedule:
    # Раз в час (владелец попросил чаще, 2026-09-16) — в отличие от
    # Яндекс.Вебмастера/Search Console, у визитов Метрики нет многосуточного
    # лага на стороне Яндекса, часовой опрос даёт реально новые данные.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      debug_filter:
        description: 'Диагностика: сравнить визиты с фильтром /admin и без (ничего не пишет в базу)'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/sync-yandex-metrika.mjs ${{ inputs.debug_filter && '--debug-filter --json' || '' }}
        env:
          # OAuth-токен Яндекса НЕ передаётся сюда секретом — скрипт читает
          # его из таблицы external_api_tokens тем же сервисным ключом.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
